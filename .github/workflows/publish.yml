name: Publish NuGet Package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Download repository
      - name: Checkout
        uses: actions/checkout@v4

      # Install .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore dependencies
      - name: Restore
        run: dotnet restore ./src/FS.FluentUI/FS.FluentUI.fsproj

      # Build package
      - name: Pack
        run: |
          dotnet pack ./src/FS.FluentUI/FS.FluentUI.fsproj \
            --configuration Release \
            --no-restore \
            --output ./artifacts

      # Authenticate with NuGet
      - name: NuGet Login
        uses: NuGet/login@v1
        id: login
        with:
          user: sydsutton

      # Publish package
      - name: Publish
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
